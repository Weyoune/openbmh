# SPDX-License-Identifier: GPL-3.0-only
name: OBW Editor
on:
  push:
    branches: [main, feat/obw-editor-poc]
    tags: ['editor-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: obw-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: windows-x64
          - runner: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public sources
        run: python3 tools/public_release/check_public_tree.py --root . --history --revision HEAD
      - name: Existing package boundaries
        if: runner.os == 'Linux'
        run: python3 tests/package_tests.py
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libgtk-3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libgl1-mesa-dev xvfb xauth xdotool
      - name: MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          arch: x64
      - name: Configure
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then args+=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DOPENBMH_BUILD_EDITOR=ON -DBMH_DATA= "${args[@]}"
      - name: Check portable Windows WebP instructions
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json, pathlib, re
          commands = json.loads(pathlib.Path('build/compile_commands.json').read_text())
          simd = [c for c in commands if 'libwebp' in c['file'] and re.search(r'_sse(?:2|41)\.c$', c['file'])]
          assert simd, 'No WebP runtime-dispatched SIMD sources found'
          assert all(not re.search(r'/arch:AVX', c['command'], re.I) for c in simd), 'WebP SSE paths must run without AVX'
          print('WebP SSE paths retain the Windows x64 baseline and runtime CPU detection')
      - name: Build editor and synthetic tests
        run: cmake --build build --target openbmh_editor launcher_gui_smoke editor_core_tests editor_comparison_tests editor_regulations_tests --parallel 2
      - name: Native editor core and MCP tests
        run: ctest --test-dir build -C Release -R "^editor_(core_tests|comparison_tests|regulations_tests|version)$" --output-on-failure --output-junit editor-tests.xml
      - name: Linux native GUI smoke
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' python3 tests/editor_gui_smoke.py build/OpenBMHEditor
          xvfb-run -a -s '-screen 0 1600x1000x24' build/OpenBMHEditor --demo --page players --settings build/test-options.json --screenshot build/editor.png --quit-after-ms 1800
          xvfb-run -a -s '-screen 0 1600x1000x24' python3 tests/editor_startup_smoke.py build/OpenBMHEditor --launcher build/launcher_gui_smoke
      - name: Windows Server native GUI and WARP fallback
        if: runner.os == 'Windows'
        run: python3 tests/editor_startup_smoke.py build/OpenBMHEditor.exe --launcher build/launcher_gui_smoke.exe
      - name: Package editor
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then args+=(--source-package); fi
          python3 tools/package/make_editor_package.py --build build --out dist --platform ${{ matrix.platform }} "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpenBMHEditor-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: editor-checks-${{ matrix.platform }}
          path: |
            build/editor-tests.xml
            build/editor.png
  release:
    if: startsWith(github.ref, 'refs/tags/editor-v')
    needs: editor
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: OpenBMHEditor-*
          path: dist
          merge-multiple: true
      - name: Prepare editor release for review
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os, pathlib, re, subprocess
          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'editor-v([0-9]+)\.([0-9]+)\.[0-9]+', tag)
          if not match:
              raise SystemExit('Invalid editor release tag')
          version = tag.removeprefix('editor-v')
          notes = pathlib.Path('docs/release') / ('editor-' + match[1] + '.' + match[2]) / 'RELEASE_NOTES.md'
          packages = sorted(pathlib.Path('dist').glob('*.zip'))
          expected = {'OpenBMHEditor-' + version + '-' + kind + '.zip'
                      for kind in ('windows-x64', 'linux-x64', 'macos-arm64', 'source')}
          if {p.name for p in packages} != expected or not notes.is_file():
              raise SystemExit('Missing or mismatched editor release files')
          subprocess.run(['gh', 'release', 'create', tag, *map(str, packages), '--draft',
                          '--verify-tag', '--title', 'OpenBMH Editor ' + version,
                          '--notes-file', str(notes)], check=True)
